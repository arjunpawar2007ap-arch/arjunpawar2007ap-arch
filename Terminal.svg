<text x="40" y="420" font-size="13.5" fill="#30363d">-----------------------------------------------------------------------------------------------------------------------------------------</text>

<text x="40" y="442" font-size="14" fill="#39ff14">arjun@iitb:~$ <tspan fill="#c9d1d9">cat about.txt</tspan></text>
<text x="40" y="464" font-size="13.5" fill="#8b949e">I do not stick to one field. I pick what is hard and suffer finishing it ;)</text>
<text x="40" y="486" font-size="13.5" fill="#8b949e">It is all about random 3AM motivational builds.</text>

<text x="40" y="514" font-size="14" fill="#39ff14">arjun@iitb:~$ <tspan fill="#c9d1d9">./skills.sh --focus</tspan></text>
<text x="40" y="536" font-size="13.5" fill="#c678dd">[pure mathematics &amp; physics]</text>
<text x="280.6" y="536" font-size="13.5" fill="#61afef">[machine learning / financial NLP]</text>
<text x="569.8" y="536" font-size="13.5" fill="#e5c07b">[electronics &amp; robotics]</text>
<text x="778.0" y="536" font-size="13.5" fill="#39ff14">[quant / DSA (C++)]</text>

<text x="40" y="564" font-size="14" fill="#39ff14">arjun@iitb:~$ <tspan fill="#c9d1d9">./tech_stack.sh --used</tspan></text>

